# =============================================================================
# Transmission VPN Shield - Runtime Configuration
# =============================================================================
# This file is the shipped DEFAULT TEMPLATE only — it is re-extracted from
# the package archive on every install/upgrade and is NOT persistent.
#
# File location on NAS after install (persistent, edit this one):
#   /var/packages/transmission-vpn-shield/etc/guard.conf
# (target/conf/guard.conf is a symlink to the same file, kept for convenience.)
#
# After editing this file, restart the package from DSM Package Center
# (or via SSH: sudo synopkg restart transmission-vpn-shield)
# =============================================================================


# -----------------------------------------------------------------------------
# Transmission system user
# -----------------------------------------------------------------------------
# The user account that runs Transmission on your NAS.
# On most Synology systems this is "sc-transmission" (DSM native package).
# The shield auto-detects it if left as-is, but you can override it here.
# Other common values: "transmission", "debian-transmission"
TRANSMISSION_USER="sc-transmission"


# -----------------------------------------------------------------------------
# VPN interface
# -----------------------------------------------------------------------------
# The network interface created by your VPN client.
# OpenVPN (most common): tun0
# WireGuard: wg0
# Check the current interfaces on your NAS with: ip link show
VPN_IF="tun0"


# -----------------------------------------------------------------------------
# Routing table
# -----------------------------------------------------------------------------
# Internal Linux routing table used to isolate Transmission traffic.
# You only need to change these if they conflict with another package
# that already uses table ID 200. Leave them as-is in most cases.
RT_TABLE_ID="200"
RT_TABLE_NAME="transmissionvpn"


# -----------------------------------------------------------------------------
# Kill switch
# -----------------------------------------------------------------------------
# When set to "1": if the VPN is down, Transmission traffic is BLOCKED
# rather than leaking through your regular internet connection.
# When set to "0": Transmission can fall back to the normal connection
# if the VPN drops (NOT recommended — your real IP may be exposed).
#
# Note: the kill switch requires the iptables "owner" module (xt_owner).
# If your NAS kernel doesn't support it, the shield logs a warning and
# falls back to routing-only protection (still safe — no VPN route = no traffic).
ENFORCE_KILLSWITCH_WHEN_VPN_DOWN="1"


# -----------------------------------------------------------------------------
# Public IP refresh interval
# -----------------------------------------------------------------------------
# How often (in seconds) the shield re-checks your public IP address
# through the VPN tunnel and caches it for display in the web UI.
# Default: 7200 (every 2 hours). Set to 0 to disable background refresh.
PUBLIC_IP_REFRESH_SEC="7200"


# -----------------------------------------------------------------------------
# VPN forwarded port  ←  IMPORTANT for good download/upload speeds
# -----------------------------------------------------------------------------
# Some VPN providers let you "forward" a port through the VPN so that
# other BitTorrent peers can connect TO you directly (not just you to them).
# This significantly improves speeds and seeding ratios.
#
# How to set this up (example: AirVPN):
#   1. Log in to your VPN provider's website.
#   2. Find the "Port forwarding" or "Forwarded ports" section.
#   3. Create/note the forwarded port number (e.g. 56460).
#   4. Set FORWARDED_PORT to that number below.
#   5. Save this file and restart the package.
#
# The shield will automatically tell Transmission to listen on this port
# every time the service starts — no manual configuration needed.
#
# IMPORTANT: you do NOT need to open this port on your router or DSM
# firewall. Traffic enters through the VPN tunnel, bypassing your router.
#
# Leave empty ("") if your VPN provider does not support port forwarding
# or if you have not configured one yet.
FORWARDED_PORT=""


# -----------------------------------------------------------------------------
# Transmission RPC
# -----------------------------------------------------------------------------
# The shield talks to Transmission over RPC (127.0.0.1) to push FORWARDED_PORT
# and to run the port-test.
RPC_PORT="9091"
#
# If you have "Enable authentication" checked in Transmission, the RPC calls
# need credentials or they fail silently with HTTP 401. Put the username and
# password in a SEPARATE file so this world-readable config never holds them:
#
#   /var/packages/transmission-vpn-shield/etc/guard.secret   (chmod 600, root)
#     RPC_USER="youruser"
#     RPC_PASS="yourpass"
#
# The shield creates guard.secret (empty) on install; edit it and restart.


# -----------------------------------------------------------------------------
# Self-heal reconcile daemon
# -----------------------------------------------------------------------------
# The shield runs a background daemon that re-asserts the protected state
# (routing table, ip rules, fail-closed blackhole, forwarded port) on a timer,
# so it recovers automatically after a VPN reconnect, an unlucky boot order or
# a package/Transmission restart — no manual stop/start needed.
#
# How often (in seconds) to reconcile. Lower = faster recovery, more wakeups.
RECONCILE_INTERVAL_SEC="30"


# -----------------------------------------------------------------------------
# IPv6 handling for Transmission traffic
# -----------------------------------------------------------------------------
#   route = policy-route Transmission's IPv6 through the VPN, same as IPv4
#           (default; falls back to "blocked" whenever the tunnel is down).
#   block = never let Transmission use IPv6 — a blackhole route in the
#           dedicated table drops it. Pick this if you want IPv6 off for
#           torrents but still leak-proof.
#   off   = the shield does not touch IPv6 at all. NOT recommended: if your
#           LAN/WAN has IPv6, Transmission's IPv6 traffic can leak outside
#           the tunnel.
#
# Note: "route" and "block" need kernel >= 4.10 for per-UID IPv6 rules. On
# older DSM builds the shield logs a warning and protects IPv4 only; set
# IPV6_MODE="off" there to silence it.
IPV6_MODE="route"


# -----------------------------------------------------------------------------
# Restart Transmission automatically after the shield starts
# -----------------------------------------------------------------------------
# The shield always STOPS Transmission when it goes down (so it never runs
# unprotected) but by default does NOT start it back up — you do that once
# you've checked the shield is green.
#
#   1 = after the shield starts, restart Transmission too, but ONLY when the
#       VPN is up and the default route is already in the dedicated table
#       (never launched into an unprotected state). Handy so you don't have to
#       start Transmission by hand after every shield upgrade / reboot.
#   0 = leave Transmission stopped, start it yourself (default, safest).
AUTOSTART_TRANSMISSION="0"


# -----------------------------------------------------------------------------
# Uptime Kuma push monitoring (optional)
# -----------------------------------------------------------------------------
# Push the shield's health to an Uptime Kuma "Push" monitor. The NAS makes
# outbound HTTPS only — nothing new is exposed on the LAN, and the Kuma
# per-monitor URL acts as a token.
#
# How to set it up:
#   1. In Uptime Kuma, create a new monitor of type "Push".
#   2. Copy the unique Push URL (looks like https://kuma.example.com/api/push/abc123).
#   3. Paste it as KUMA_PUSH_URL below.
#   4. Save this file and restart the package.
#
# The daemon pushes status=up only when ALL these checks pass:
#   - VPN interface up with an IPv4 address
#   - rt_tables entry, ip rule, and default route via VPN are present
#   - Transmission peer-port test (if FORWARDED_PORT is set) is not closed
# Killswitch state is reported in the message but does not flip the status,
# because routing alone already protects traffic when owner-match is not
# supported by the kernel.
#
# Paste only the BASE URL (e.g. https://kuma.example.com/api/push/abc123).
# If you copied Kuma's example with the trailing "?status=up&msg=OK&ping=",
# strip everything from the "?" onwards — the daemon adds its own parameters.
#
# Leave empty ("") to disable.
KUMA_PUSH_URL=""

# How often (in seconds) the daemon pushes to Kuma. Set Kuma's "Heartbeat
# Interval" to roughly the same value (or a bit higher) so a single missed
# push does not raise an alert.
KUMA_PUSH_INTERVAL_SEC="60"

# How often (in seconds) to call Transmission's port-test RPC. The result is
# cached between calls so the push loop stays cheap. Set to 0 to disable
# port-test entirely (useful if FORWARDED_PORT is empty or your VPN provider
# does not support inbound peer connections).
PORT_TEST_INTERVAL_SEC="600"
